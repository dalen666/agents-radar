<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡 agents-radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',

        extend: {

            surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' }

  <style>

    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    /* Markdown content */
    .md h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.25rem; line-height: 1.3; }
    .md h2 { font-size: 1.2rem; font-weight: 600; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid; }
    .dark .md h2 { border-color: #1e293b; }
    .md h2 { border-color: #e2e8f0; }
    .md h3 { font-size: 1.05rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .md h4 { font-size: 0.85rem; font-weight: 700; margin: 1rem 0 0.4rem; }
    .md p { margin-bottom: 0.75rem; }
    .md a { text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md hr { border: none; border-top: 1px solid; margin: 1.5rem 0; }
    .dark .md hr { border-color: #1e293b; }
    .md hr { border-color: #e2e8f0; }
    .md ul, .md ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
    .md li { margin-bottom: 0.25rem; }
    .md blockquote { border-left: 3px solid #f97316; padding: 0.5rem 1rem; margin: 0.75rem 0; }
    .md code { font-family: 'Space Mono', monospace; font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; }
    .dark .md code { background: #0f172a; border: 1px solid #1e293b; }
    .md code { background: #f1f5f9; border: 1px solid #e2e8f0; }
    .md pre { border-radius: 8px; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
    .dark .md pre { background: #0f172a; border: 1px solid #1e293b; }
    .md pre { background: #f1f5f9; border: 1px solid #e2e8f0; }
    .md pre code { background: none; border: none; padding: 0; }
    .md table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
    .md th { padding: 8px 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; }
    .dark .md th { background: #0f172a; border-bottom: 1px solid #1e293b; color: #94a3b8; }
    .md th { background: #f1f5f9; border-bottom: 1px solid #e2e8f0; color: #64748b; }
    .md td { padding: 8px 12px; vertical-align: top; }
    .dark .md td { border-bottom: 1px solid #1e293b; }
    .md td { border-bottom: 1px solid #e2e8f0; }
    .dark .md tr:nth-child(even) td { background: #0f172a; }
    .md tr:nth-child(even) td { background: #f8fafc; }
    .md details { border-radius: 8px; margin: 0.75rem 0; overflow: hidden; }
    .dark .md details { border: 1px solid #1e293b; }
    .md details { border: 1px solid #e2e8f0; }
    .md summary { cursor: pointer; padding: 10px 14px; font-family: 'Space Mono', monospace; font-size: 0.8rem; user-select: none; list-style: none; display: flex; align-items: center; gap: 8px; }
    .dark .md summary { background: #0f172a; color: #94a3b8; }
    .md summary { background: #f1f5f9; color: #64748b; }
    .md summary::-webkit-details-marker { display: none; }
    .md summary::before { content: '▶'; font-size: 8px; flex-shrink: 0; }
    .md details[open] summary::before { content: '▼'; }
    .md details > *:not(summary) { padding: 12px 14px; }
  </style>
</head>

      <a class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-surface-400 border border-surface-200 dark:border-surface-700 hover:border-brand-500 hover:text-brand-500 transition-colors" href="./feed.xml">⊕ RSS</a>
      <button id="themeBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-surface-400 border border-surface-200 dark:border-surface-700 hover:border-brand-500 hover:text-brand-500 transition-colors">
        <span id="themeIcon">◐</span><span id="themeLabel">LIGHT</span>

  <!-- ═══ Body ═══ -->
  <div id="body" class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 flex-shrink-0 border-r border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900 overflow-y-auto">

        ☰ 选择报告
      </div>

        <div class="text-[10px] font-semibold tracking-widest uppercase text-surface-400 dark:text-surface-500 mb-3">REPORTS</div>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-surface-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="searchInput" type="search" placeholder="搜索全文，如 Claude" class="w-full h-9 pl-9 pr-3 rounded-lg border border-surface-200 dark:border-surface-700 bg-white dark:bg-surface-800 text-sm placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 transition-all">
        </div>
        <div id="searchStatus" class="min-h-[14px] mt-1 text-[10px] text-surface-400 dark:text-surface-500"></div>
      </div>
      <div id="nav" class="px-2 pb-4"></div>
    </aside>

    <!-- Content -->
    <main id="cwrap" class="flex-1 overflow-y-auto">
      <div id="content" class="max-w-3xl mx-auto px-6 py-10 sm:px-10 sm:py-14">
        <div class="flex flex-col items-center justify-center gap-3 h-60 text-surface-400">
          <div class="text-4xl opacity-40">📡</div>
          <div class="text-sm">正在加载…</div>
        </div>
      </div>
    </main>

  </div>
</div>

<script>
marked.use({ breaks: true, gfm: true });
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') data.allowedTags[data.tagName] = true;
});
function renderMarkdown(raw) {
  return DOMPurify.sanitize(marked.parse(raw), { ADD_TAGS: ['details', 'summary'], ADD_ATTR: ['open'] });
}

const LABELS = {
  'ai-cli':'AI CLI 工具','ai-cli-en':'AI CLI Tools','ai-agents':'AI Agents 生态','ai-agents-en':'AI Agents Ecosystem',
  'ai-web':'OpenAI & Anthropic 官网动态','ai-web-en':'OpenAI & Anthropic Updates','ai-trending':'GitHub AI 趋势','ai-trending-en':'GitHub AI Trends',
  'ai-hn':'HN 社区动态','ai-hn-en':'HN Community Digest','ai-ph':'Product Hunt AI','ai-ph-en':'Product Hunt AI',
  'ai-arxiv':'ArXiv AI 研究','ai-arxiv-en':'ArXiv AI Research','ai-hf':'HF 热门模型','ai-hf-en':'HF Trending Models',
  'ai-community':'技术社区 AI','ai-community-en':'Tech Community AI',
};

// ── Theme ──
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');
let theme = localStorage.getItem('ar-theme') || 'dark';

function applyTheme(t) {
  theme = t;
  htmlEl.classList.toggle('dark', t === 'dark');
  themeIcon.textContent = t === 'dark' ? '◐' : '●';
  themeLabel.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
  localStorage.setItem('ar-theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');

// ── Routing ──
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && report ? { date, report } : null;
}

// ── State ──
let currentKey = null, searchIndex = null, searchReady = false, searchQuery = '', searchDebounce = null;
const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');

function setSearchStatus(t) { searchStatus.textContent = t || ''; }

function applyDateSearch(query) {
  const needle = query.trim().toLowerCase();
  let hits = 0;
  document.querySelectorAll('.date-group').forEach(grp => {
    const hdr = grp.querySelector('.date-hdr');
    if (!hdr) return;
    if (!needle || !searchIndex) { hdr.classList.remove('search-hit','bg-brand-500/5'); return; }
    const matched = (searchIndex.get(grp.dataset.date) || '').includes(needle);
    hdr.classList.toggle('search-hit', matched);
    hdr.classList.toggle('bg-brand-500/5', matched);
    if (matched) hits++;
  });
  if (!needle) setSearchStatus('');
  else if (!searchReady) setSearchStatus('正在建立索引…');
  else setSearchStatus(`匹配 ${hits} 天`);
}

async function buildSearchIndex(dates) {
  const index = new Map();
  await Promise.all(dates.map(async ({ date, reports }) => {
    const chunks = await Promise.all(reports.map(async r => { try { const res = await fetch(`./digests/${date}/${r}.md`); return res.ok ? await res.text() : ''; } catch { return ''; } }));
    index.set(date, chunks.join('\n').toLowerCase());
  }));
  return index;
}

function initSearch(dates) {
  searchReady = false; setSearchStatus('索引准备中…');
  buildSearchIndex(dates).then(index => { searchIndex = index; searchReady = true; applyDateSearch(searchQuery); if (!searchQuery.trim()) setSearchStatus(''); });
}

searchInput.addEventListener('input', () => { searchQuery = searchInput.value; clearTimeout(searchDebounce); searchDebounce = setTimeout(() => applyDateSearch(searchQuery), 120); });

function setContent(html) { document.getElementById('content').innerHTML = html; }

async function loadReport(date, report, push = true) {
  const key = `${date}/${report}`;
  if (key === currentKey) return;
  currentKey = key;
  if (push) history.pushState(null, '', `#${key}`);

  document.querySelectorAll('.rpt-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.date-hdr').forEach(h => {
    const grp = h.closest('.date-group');
    h.classList.toggle('text-brand-500', !!(grp.querySelector('.rpt-btn.active') || grp.querySelector('.lang-btn.active')));
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    h.classList.toggle('text-brand-500', !!(mGrp.querySelector('.lang-btn.active') || mGrp.querySelector('.rpt-btn.active')));
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) { g.classList.add('open'); const m = g.closest('.month-group'); if (m) m.classList.add('open'); }
  });
  document.getElementById('sidebar').classList.remove('open');
  const cwrap = document.getElementById('cwrap');
  setContent('<div class="flex flex-col items-center justify-center gap-3 h-60 text-surface-400"><div class="text-4xl opacity-40 animate-pulse">⏳</div><div class="text-sm">Loading…</div></div>');
  cwrap.scrollTop = 0;
  try {
    const res = await fetch(`./digests/${date}/${report}.md`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setContent(`<div class="md font-serif text-base leading-relaxed fade-up">${renderMarkdown(await res.text())}</div>`);
  } catch (e) {
    setContent(`<div class="flex flex-col items-center justify-center gap-3 h-60 text-surface-400"><div class="text-4xl opacity-40">⚠️</div><div class="text-sm">加载失败：${e.message}</div></div>`);
  }
}

function buildDateGroup(date, reports, isFirst) {
  const grp = document.createElement('div');
  grp.className = 'date-group' + (isFirst ? ' open' : '');
  grp.dataset.date = date;

  const hdr = document.createElement('div');
  hdr.className = 'date-hdr flex items-center justify-between px-3 py-2 cursor-pointer rounded-lg text-sm font-semibold text-surface-500 dark:text-surface-400 hover:text-surface-700 dark:hover:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors';
  const dayLabel = date.slice(8);
  hdr.innerHTML = `<span>${dayLabel}</span><span class="text-[10px] transition-transform duration-200 ${isFirst ? 'rotate-90' : ''}">▶</span>`;
  hdr.onclick = () => { grp.classList.toggle('open'); hdr.querySelector('span:last-child').classList.toggle('rotate-90'); };

  const list = document.createElement('div');
  list.className = 'rpt-list max-h-0 overflow-hidden transition-all duration-300';
  if (isFirst) list.style.maxHeight = '600px';
  // Watch for open class changes
  new MutationObserver(() => { list.style.maxHeight = grp.classList.contains('open') ? '600px' : '0'; }).observe(grp, { attributes: true, attributeFilter: ['class'] });

  const baseReports = reports.filter(r => !r.endsWith('-en'));
  baseReports.forEach(r => {
    const enKey = r + '-en';
    const hasEn = reports.includes(enKey);
    if (hasEn) {
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between px-3 py-1.5 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors group';
      const label = document.createElement('span');
      label.className = 'flex-1 text-[13px] text-surface-500 dark:text-surface-400 truncate';
      const baseLabel = LABELS[r] || r;
      label.textContent = baseLabel;
      label.title = baseLabel;
      const btns = document.createElement('div');
      btns.className = 'flex gap-1 flex-shrink-0';
      ['ZH','EN'].forEach((lang, i) => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn px-2 py-0.5 rounded text-[10px] font-semibold tracking-wider border transition-all';
        btn.dataset.key = `${date}/${i === 0 ? r : enKey}`;
        btn.textContent = lang;
        btn.onclick = () => loadReport(date, i === 0 ? r : enKey);
        btns.appendChild(btn);
      });
      row.append(label, btns);
      list.appendChild(row);
    } else {
      const btn = document.createElement('button');
      btn.className = 'rpt-btn w-full text-left px-3 py-1.5 rounded-lg text-[13px] text-surface-500 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors';
      btn.dataset.key = `${date}/${r}`;
      btn.textContent = LABELS[r] || r;
      btn.onclick = () => loadReport(date, r);
      list.appendChild(btn);
    }
  });

  grp.append(hdr, list);
  return grp;
}

function buildNav(dates) {
  const nav = document.getElementById('nav');
  const months = new Map();
  dates.forEach(e => { const m = e.date.slice(0, 7); if (!months.has(m)) months.set(m, []); months.get(m).push(e); });

  let isFirstDate = true, isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group mb-1' + (isFirstMonth ? ' open' : '');

    const mHdr = document.createElement('div');
    mHdr.className = 'month-hdr flex items-center justify-between px-3 py-2 cursor-pointer rounded-lg text-xs font-bold tracking-wider uppercase text-surface-400 dark:text-surface-500 hover:text-surface-600 dark:hover:text-surface-300 transition-colors';
    mHdr.innerHTML = `<span>${month}</span><span class="text-[10px] transition-transform duration-200 ${isFirstMonth ? 'rotate-90' : ''}">▶</span>`;
    mHdr.onclick = () => { mGrp.classList.toggle('open'); mHdr.querySelector('span:last-child').classList.toggle('rotate-90'); };

    const mBody = document.createElement('div');
    mBody.className = 'month-body overflow-hidden transition-all duration-300';
    mBody.style.maxHeight = isFirstMonth ? '9999px' : '0';
    new MutationObserver(() => { mBody.style.maxHeight = mGrp.classList.contains('open') ? '9999px' : '0'; }).observe(mGrp, { attributes: true, attributeFilter: ['class'] });

    entries.forEach(({ date, reports }) => { mBody.appendChild(buildDateGroup(date, reports, isFirstDate)); isFirstDate = false; });
    mGrp.append(mHdr, mBody);
    nav.appendChild(mGrp);
    isFirstMonth = false;
  });
}

// Update active button styles
const observer = new MutationObserver(() => {
  document.querySelectorAll('.lang-btn').forEach(b => {
    if (b.classList.contains('active')) {
      b.className = 'lang-btn px-2 py-0.5 rounded text-[10px] font-semibold tracking-wider border border-brand-500 text-brand-500 bg-brand-500/10 transition-all';
    } else {
      b.className = 'lang-btn px-2 py-0.5 rounded text-[10px] font-semibold tracking-wider border border-surface-200 dark:border-surface-700 text-surface-400 hover:border-surface-400 dark:hover:border-surface-500 transition-all';
    }
  });
  document.querySelectorAll('.rpt-btn').forEach(b => {
    if (b.classList.contains('active')) {
      b.classList.add('text-brand-500','bg-brand-500/5','border-l-2','border-brand-500');
    } else {
      b.classList.remove('text-brand-500','bg-brand-500/5','border-l-2','border-brand-500');
    }
  });
});
observer.observe(document.getElementById('nav'), { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

window.addEventListener('popstate', () => { const h = getHash(); if (h) loadReport(h.date, h.report, false); });

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');
    buildNav(dates);
    initSearch(dates);
    const hash = getHash();
    const first = dates[0];
    if (hash && dates.find(d => d.date === hash.date && d.reports.includes(hash.report))) {
      loadReport(hash.date, hash.report, false);
    } else if (first?.reports?.length) {
      const r0 = first.reports[0];
      history.replaceState(null, '', `#${first.date}/${r0}`);
      loadReport(first.date, r0, false);
    }
  } catch (e) {
    document.getElementById('nav').innerHTML = `<div class="flex flex-col items-center justify-center h-20 text-xs text-surface-400">⚠️ ${e.message}</div>`;
    setContent('<div class="flex flex-col items-center justify-center gap-3 h-60 text-surface-400"><div class="text-4xl opacity-40">📡</div><div>无法加载 manifest.json</div></div>');
  }
