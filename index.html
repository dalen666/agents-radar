<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡 agents-radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="agents-radar RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    /* ═══ Cyberpunk Design System ═══ */
    :root {
      --neon-cyan: #00f0ff;
      --neon-purple: #a855f7;
      --neon-pink: #f472b6;
      --neon-green: #34d399;
      --neon-orange: #fb923c;
      --grad-1: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --grad-2: linear-gradient(135deg, #0c0c1d, #1a1a3e, #0d0d2b);
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.06);
      --glass-hover: rgba(255,255,255,0.06);
      --glass-active: rgba(255,255,255,0.08);
      --text-primary: #e8eaed;
      --text-secondary: #8b8fa3;
      --text-muted: #5a5e73;
      --border: rgba(255,255,255,0.06);
      --code-bg: rgba(0,0,0,0.3);
      --link: #60a5fa;
    }
    [data-theme="light"] {
      --grad-1: linear-gradient(135deg, #f0f4ff, #e8e0f7, #f5f0ff);
      --grad-2: linear-gradient(135deg, #faf5ff, #f0e8ff, #f5f0ff);
      --glass: rgba(255,255,255,0.6);
      --glass-border: rgba(0,0,0,0.06);
      --glass-hover: rgba(255,255,255,0.8);
      --glass-active: rgba(255,255,255,0.9);
      --text-primary: #1a1a2e;
      --text-secondary: #5a5e73;
      --text-muted: #8b8fa3;
      --border: rgba(0,0,0,0.06);
      --code-bg: rgba(0,0,0,0.04);
      --link: #6366f1;
      --neon-cyan: #0891b2;
      --neon-purple: #7c3aed;
      --neon-pink: #db2777;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--grad-1);
      color: var(--text-primary);
      line-height: 1.6; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated background mesh ── */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 600px 600px at 10% 20%, rgba(168,85,247,0.08), transparent),
        radial-gradient(ellipse 500px 500px at 80% 80%, rgba(0,240,255,0.06), transparent),
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(244,114,182,0.04), transparent);
      animation: mesh-drift 20s ease-in-out infinite alternate;
    }
    @keyframes mesh-drift {
      0% { transform: scale(1) translate(0,0); }
      100% { transform: scale(1.1) translate(-20px, 10px); }
    }
    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 600px 600px at 10% 20%, rgba(168,85,247,0.06), transparent),
        radial-gradient(ellipse 500px 500px at 80% 80%, rgba(0,240,255,0.04), transparent);
    }

    /* ═══ Layout ═══ */
    #app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

    /* ═══ Header ═══ */
    #hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 60px; flex-shrink: 0; z-index: 50;
      background: var(--glass);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 20px rgba(0,240,255,0.2), 0 0 40px rgba(168,85,247,0.1);
      animation: icon-glow 3s ease-in-out infinite alternate;
    }
    @keyframes icon-glow {
      0% { box-shadow: 0 0 20px rgba(0,240,255,0.2), 0 0 40px rgba(168,85,247,0.1); }
      100% { box-shadow: 0 0 25px rgba(168,85,247,0.25), 0 0 50px rgba(0,240,255,0.15); }
    }
    .brand-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
    .brand-text span { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hdr-right { display: flex; align-items: center; gap: 6px; }
    .signal { width: 6px; height: 6px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .hdr-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 10px; font-size: 11px; font-weight: 500;
      color: var(--text-secondary); border: 1px solid var(--glass-border);
      background: var(--glass); cursor: pointer; text-decoration: none;
      backdrop-filter: blur(8px); transition: all 0.2s ease;
    }
    .hdr-btn:hover { color: var(--neon-cyan); border-color: rgba(0,240,255,0.2); background: rgba(0,240,255,0.05); box-shadow: 0 0 15px rgba(0,240,255,0.08); }
    .hdr-btn.icon-only { padding: 8px; }
    .hdr-btn svg { display: block; }

    /* ═══ Body ═══ */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* ═══ Sidebar ═══ */
    #sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--glass);
      border-right: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      overflow-y: auto; display: flex; flex-direction: column;
    }
    #sidebar::-webkit-scrollbar { width: 3px; }
    #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    .side-header { padding: 20px 16px 12px; }
    .side-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 14px;
    }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted); }
    #searchInput {
      width: 100%; height: 38px; padding: 0 14px 0 36px;
      border: 1px solid var(--glass-border); border-radius: 10px;
      background: rgba(0,0,0,0.2); color: var(--text-primary);
      font-family: inherit; font-size: 13px;
      backdrop-filter: blur(8px); transition: all 0.2s ease;
    }
    [data-theme="light"] #searchInput { background: rgba(255,255,255,0.5); }
    #searchInput:focus { outline: none; border-color: rgba(0,240,255,0.3); box-shadow: 0 0 0 3px rgba(0,240,255,0.08), 0 0 20px rgba(0,240,255,0.06); }
    #searchInput::placeholder { color: var(--text-muted); }
    #searchStatus { min-height: 16px; margin-top: 6px; font-size: 10px; color: var(--text-muted); }
    #nav { padding: 4px 10px 16px; flex: 1; }

    /* ── Month group ── */
    .month-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; cursor: pointer; border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.1em; text-transform: uppercase;
      transition: all 0.2s ease; user-select: none;
    }
    .month-hdr:hover { color: var(--text-secondary); background: var(--glass-hover); }
    .month-hdr.lit { color: var(--neon-purple); }
    .month-body { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1); }
    .month-group.open .month-body { max-height: 9999px; }

    /* ── Date group ── */
    .date-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px; cursor: pointer; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      transition: all 0.2s ease; user-select: none;
    }
    .date-hdr:hover { color: var(--text-primary); background: var(--glass-hover); }
    .date-hdr.lit { color: var(--neon-cyan); }
    .date-hdr.search-hit { color: var(--neon-cyan); background: rgba(0,240,255,0.06); box-shadow: inset 0 0 20px rgba(0,240,255,0.03); }
    .arr { font-size: 8px; transition: transform 0.25s ease; display: inline-block; }
    .date-group.open .arr, .month-group.open > .month-hdr .arr { transform: rotate(90deg); }
    .rpt-list { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1); }
    .date-group.open .rpt-list { max-height: 600px; }

    /* ── Report buttons ── */
    .rpt-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 12px; border-radius: 8px; transition: all 0.15s ease; }
    .rpt-row:hover { background: var(--glass-hover); }
    .rpt-label { flex: 1; font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.15s; }
    .rpt-row:hover .rpt-label { color: var(--text-primary); }
    .lang-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .lang-btn {
      padding: 3px 10px; border-radius: 6px; font-size: 9px; font-weight: 700;
      letter-spacing: 0.08em; cursor: pointer;
      border: 1px solid var(--glass-border);
      color: var(--text-muted); background: transparent;
      transition: all 0.2s ease;
    }
    .lang-btn:hover { border-color: rgba(168,85,247,0.3); color: var(--neon-purple); }
    .lang-btn.active {
      border-color: transparent; color: #fff;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      box-shadow: 0 0 12px rgba(0,240,255,0.15);
    }
    [data-theme="light"] .lang-btn.active { color: #fff; }
    .rpt-btn {
      display: block; width: 100%; padding: 6px 12px; border-radius: 8px;
      background: none; border: none; border-left: 2px solid transparent;
      text-align: left; cursor: pointer; font-family: inherit; font-size: 13px;
      color: var(--text-secondary); transition: all 0.15s ease;
    }
    .rpt-btn:hover { background: var(--glass-hover); color: var(--text-primary); }
    .rpt-btn.active {
      color: var(--neon-cyan); border-left-color: var(--neon-cyan);
      background: rgba(0,240,255,0.04);
      box-shadow: inset 3px 0 12px -6px rgba(0,240,255,0.1);
    }

    /* ═══ Content ═══ */
    #cwrap { flex: 1; overflow-y: auto; }
    #cwrap::-webkit-scrollbar { width: 4px; }
    #cwrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    #content { max-width: 800px; margin: 0 auto; padding: 44px 52px 80px; }

    .msg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 240px; color: var(--text-muted); font-size: 13px; }
    .msg-icon { font-size: 40px; opacity: 0.3; }

    @keyframes fade-up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    .fade-up { animation: fade-up 0.4s cubic-bezier(0.4,0,0.2,1); }

    /* ═══ Markdown ═══ */
    .md {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      font-size: 15px; line-height: 1.85; color: var(--text-primary);
    }
    .md h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 1.5rem; line-height: 1.3; letter-spacing: -0.02em; }
    .md h1::after { content:''; display:block; width:40px; height:3px; border-radius:2px; background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple)); margin-top:12px; }
    .md h2 { font-size: 1.15rem; font-weight: 700; margin: 2.2rem 0 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .md h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .md h4 { font-size: 0.85rem; font-weight: 700; margin: 1rem 0 0.4rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }
    .md p { margin-bottom: 0.8rem; }
    .md a { color: var(--link); text-decoration: none; transition: color 0.15s; }
    .md a:hover { color: var(--neon-cyan); }
    .md strong { font-weight: 600; color: var(--text-primary); }
    .md hr { border: none; height: 1px; background: var(--border); margin: 2rem 0; }
    .md ul, .md ol { padding-left: 1.5rem; margin-bottom: 0.8rem; }
    .md li { margin-bottom: 0.3rem; }
    .md li::marker { color: var(--neon-purple); }
    .md blockquote {
      border-left: 3px solid var(--neon-purple); padding: 0.6rem 1.2rem; margin: 0.8rem 0;
      color: var(--text-secondary); font-style: italic;
      background: rgba(168,85,247,0.04); border-radius: 0 8px 8px 0;
    }
    .md code {
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
      background: var(--code-bg); border: 1px solid var(--border);
      padding: 2px 7px; border-radius: 5px;
    }
    .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; overflow-x: auto; margin: 1rem 0; }
    .md pre code { background: none; border: none; padding: 0; font-size: 0.75rem; }
    .md table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.83rem; }
    .md th {
      background: var(--code-bg); border-bottom: 1px solid var(--border);
      padding: 9px 14px; font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); text-align: left;
    }
    .md td { border-bottom: 1px solid var(--border); padding: 9px 14px; vertical-align: top; }
    .md tr:hover td { background: var(--glass-hover); }
    .md details { border: 1px solid var(--border); border-radius: 10px; margin: 0.8rem 0; overflow: hidden; }
    .md summary {
      cursor: pointer; padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
      color: var(--text-muted); background: var(--code-bg);
      user-select: none; list-style: none; display: flex; align-items: center; gap: 8px;
      transition: all 0.15s;
    }
    .md summary:hover { color: var(--neon-cyan); }
    .md summary::-webkit-details-marker { display: none; }
    .md summary::before { content: '▶'; font-size: 7px; flex-shrink: 0; color: var(--neon-purple); }
    .md details[open] summary::before { content: '▼'; }
    .md details > *:not(summary) { padding: 12px 14px; }

    /* ═══ Dashboard ═══ */
    .dash { padding: 0; }
    .dash-header { margin-bottom: 28px; }
    .dash-header h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
    .dash-header h1::after { content:''; display:block; width:40px; height:3px; border-radius:2px; background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple)); margin-top:10px; }
    .dash-header .date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
    .dash-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .stat-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 16px; text-align: center;
      backdrop-filter: blur(8px); transition: all 0.2s;
    }
    .stat-card:hover { border-color: rgba(0,240,255,0.15); box-shadow: 0 0 20px rgba(0,240,255,0.05); }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .chart-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 18px; backdrop-filter: blur(8px);
    }
    .chart-card.full { grid-column: 1 / -1; }
    .chart-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .chart-title .emoji { font-size: 14px; }
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap canvas { width: 100% !important; }
    .dash-list { margin-top: 8px; }
    .dash-list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; transition: background 0.1s;
    }
    .dash-list-item:last-child { border-bottom: none; }
    .dash-list-item a { color: var(--text-primary); text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
    .dash-list-item a:hover { color: var(--neon-cyan); }
    .dash-list-item .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .dash-list-item .meta .hot { color: var(--neon-orange); }
    @media (max-width: 768px) {
      .dash-grid { grid-template-columns: 1fr; }
      .dash-stats { grid-template-columns: repeat(2, 1fr); }
    }

    /* ═══ Mobile ═══ */
    #mob-toggle { display: none; }
    @media (max-width: 768px) {
      #hdr { padding: 0 14px; }
      .hdr-right { gap: 4px; }
      .hdr-join { display: none; }
      body { overflow: auto; }
      #app { height: auto; min-height: 100vh; }
      #body { flex-direction: column; overflow: visible; }
      #cwrap { overflow: visible; }
      #sidebar {
        width: 100%; border-right: none; border-bottom: 1px solid var(--glass-border);
        max-height: 48px; overflow: hidden; padding: 0;
        transition: max-height 0.3s ease;
      }
      #sidebar.open { max-height: 60vh; overflow-y: auto; padding: 0 0 8px; }
      #mob-toggle {
        display: flex; align-items: center; gap: 8px;
        height: 48px; padding: 0 16px; cursor: pointer;
        font-size: 13px; color: var(--text-muted);
      }
      #content { padding: 20px 16px 48px; }
      .md { font-size: 14px; }
    }
  </style>
</head>

<div id="app">
  <div id="hdr">
    <div class="brand">
      <div class="brand-icon">📡</div>
      <div class="brand-text"><span>agents-radar</span></div>

    <div class="hdr-right">

      </a>
      <a class="hdr-btn hdr-join" href="https://t.me/agents_radar" target="_blank" rel="noopener noreferrer">✈ Telegram</a>

      <a class="hdr-btn hdr-join" href="./feed.xml">⊕ RSS</a>

  <div id="body">
    <div id="sidebar">
      <div id="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ 选择报告</div>
      <div class="side-header">
        <div class="side-label">// REPORTS</div>
        <button id="dashBtn" onclick="loadDashboard()" style="width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text-secondary);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:14px;transition:all 0.2s" onmouseover="this.style.borderColor='rgba(0,240,255,0.2)';this.style.color='var(--neon-cyan)'" onmouseout="this.style.borderColor='var(--glass-border)';this.style.color='var(--text-secondary)'">📊 Dashboard</button>
        <div class="search-wrap">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="searchInput" type="search" placeholder="搜索全文，如 Claude">
        </div>
        <div id="searchStatus"></div>
      </div>
      <div id="nav"></div>
    </div>

    <div id="cwrap">
      <div id="content">
        <div class="msg"><div class="msg-icon">📡</div><div>正在加载…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
marked.use({ breaks: true, gfm: true });
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') data.allowedTags[data.tagName] = true;
});
function renderMarkdown(raw) {
  return DOMPurify.sanitize(marked.parse(raw), { ADD_TAGS: ['details', 'summary'], ADD_ATTR: ['open'] });
}

const LABELS = {
  'ai-cli':'AI CLI 工具','ai-cli-en':'AI CLI Tools','ai-agents':'AI Agents 生态','ai-agents-en':'AI Agents Ecosystem',
  'ai-web':'OpenAI & Anthropic 官网动态','ai-web-en':'OpenAI & Anthropic Updates','ai-trending':'GitHub AI 趋势','ai-trending-en':'GitHub AI Trends',
  'ai-hn':'HN 社区动态','ai-hn-en':'HN Community Digest','ai-ph':'Product Hunt AI','ai-ph-en':'Product Hunt AI',
  'ai-arxiv':'ArXiv AI 研究','ai-arxiv-en':'ArXiv AI Research','ai-hf':'HF 热门模型','ai-hf-en':'HF Trending Models',
  'ai-community':'技术社区 AI','ai-community-en':'Tech Community AI',
};

// ── Theme ──
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');
let theme = localStorage.getItem('ar-theme') || 'dark';

function applyTheme(t) {
  theme = t;
  htmlEl.dataset.theme = t;
  themeIcon.textContent = t === 'dark' ? '◐' : '●';
  themeLabel.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
  localStorage.setItem('ar-theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');

// ── Routing ──
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && report ? { date, report } : null;
}

// ── State ──
let currentKey = null, searchIndex = null, searchReady = false, searchQuery = '', searchDebounce = null;
const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');

function setSearchStatus(t) { searchStatus.textContent = t || ''; }

function applyDateSearch(query) {
  const needle = query.trim().toLowerCase();
  let hits = 0;
  document.querySelectorAll('.date-group').forEach(grp => {
    const hdr = grp.querySelector('.date-hdr');
    if (!hdr) return;
    if (!needle || !searchIndex) { hdr.classList.remove('search-hit'); return; }
    const matched = (searchIndex.get(grp.dataset.date) || '').includes(needle);
    hdr.classList.toggle('search-hit', matched);
    if (matched) hits++;
  });
  if (!needle) setSearchStatus('');
  else if (!searchReady) setSearchStatus('正在建立索引…');
  else setSearchStatus(`匹配 ${hits} 天`);
}

async function buildSearchIndex(dates) {
  const index = new Map();
  await Promise.all(dates.map(async ({ date, reports }) => {
    const chunks = await Promise.all(reports.map(async r => { try { const res = await fetch(`./digests/${date}/${r}.md`); return res.ok ? await res.text() : ''; } catch { return ''; } }));
    index.set(date, chunks.join('\n').toLowerCase());
  }));
  return index;
}

function initSearch(dates) {
  searchReady = false; setSearchStatus('索引准备中…');
  buildSearchIndex(dates).then(index => { searchIndex = index; searchReady = true; applyDateSearch(searchQuery); if (!searchQuery.trim()) setSearchStatus(''); });
}

searchInput.addEventListener('input', () => { searchQuery = searchInput.value; clearTimeout(searchDebounce); searchDebounce = setTimeout(() => applyDateSearch(searchQuery), 120); });

function setContent(html) { document.getElementById('content').innerHTML = html; }

async function loadReport(date, report, push = true) {
  const key = `${date}/${report}`;
  if (key === currentKey) return;
  currentKey = key;
  if (push) history.pushState(null, '', `#${key}`);
  document.querySelectorAll('.rpt-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.date-hdr').forEach(h => {
    const grp = h.closest('.date-group');
    h.classList.toggle('lit', !!(grp.querySelector('.rpt-btn.active') || grp.querySelector('.lang-btn.active')));
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    h.classList.toggle('lit', !!(mGrp.querySelector('.lang-btn.active') || mGrp.querySelector('.rpt-btn.active')));
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) { g.classList.add('open'); const m = g.closest('.month-group'); if (m) m.classList.add('open'); }
  });
  document.getElementById('sidebar').classList.remove('open');
  const cwrap = document.getElementById('cwrap');
  setContent('<div class="msg"><div class="msg-icon">⏳</div><div>Loading…</div></div>');
  cwrap.scrollTop = 0;
  try {
    const res = await fetch(`./digests/${date}/${report}.md`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setContent(`<div class="md fade-up">${renderMarkdown(await res.text())}</div>`);
  } catch (e) {
    setContent(`<div class="msg"><div class="msg-icon">⚠️</div><div>加载失败：${e.message}</div></div>`);
  }
}

function buildDateGroup(date, reports, isFirst) {
  const grp = document.createElement('div');
  grp.className = 'date-group' + (isFirst ? ' open' : '');
  grp.dataset.date = date;
  const hdr = document.createElement('div');
  hdr.className = 'date-hdr';
  const dayLabel = date.slice(8);
  const dateText = document.createTextNode(dayLabel + '\u00a0');
  const arrSpan = document.createElement('span');
  arrSpan.className = 'arr'; arrSpan.textContent = '▶';
  hdr.appendChild(dateText); hdr.appendChild(arrSpan);
  hdr.onclick = () => grp.classList.toggle('open');
  const list = document.createElement('div');
  list.className = 'rpt-list';
  const baseReports = reports.filter(r => !r.endsWith('-en'));
  baseReports.forEach(r => {
    const enKey = r + '-en';
    const hasEn = reports.includes(enKey);
    if (hasEn) {
      const row = document.createElement('div');
      row.className = 'rpt-row';
      const label = document.createElement('span');
      label.className = 'rpt-label';
      const baseLabel = LABELS[r] || r;
      label.textContent = baseLabel; label.title = baseLabel;
      const btns = document.createElement('div');
      btns.className = 'lang-btns';
      const zhBtn = document.createElement('button');
      zhBtn.className = 'lang-btn'; zhBtn.dataset.key = `${date}/${r}`; zhBtn.textContent = 'ZH'; zhBtn.onclick = () => loadReport(date, r);
      const enBtn = document.createElement('button');
      enBtn.className = 'lang-btn'; enBtn.dataset.key = `${date}/${enKey}`; enBtn.textContent = 'EN'; enBtn.onclick = () => loadReport(date, enKey);
      btns.append(zhBtn, enBtn);
      row.append(label, btns);
      list.appendChild(row);
    } else {
      const btn = document.createElement('button');
      btn.className = 'rpt-btn'; btn.dataset.key = `${date}/${r}`;
      btn.textContent = LABELS[r] || r;
      btn.onclick = () => loadReport(date, r);
      list.appendChild(btn);
    }
  });
  grp.append(hdr, list);
  return grp;
}

function buildNav(dates) {
  const nav = document.getElementById('nav');
  const months = new Map();
  dates.forEach(e => { const m = e.date.slice(0, 7); if (!months.has(m)) months.set(m, []); months.get(m).push(e); });
  let isFirstDate = true, isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group' + (isFirstMonth ? ' open' : '');
    const mHdr = document.createElement('div');
    mHdr.className = 'month-hdr';
    const mText = document.createTextNode(month + '\u00a0');
    const mArr = document.createElement('span');
    mArr.className = 'arr'; mArr.textContent = '▶';
    mHdr.appendChild(mText); mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');
    const mBody = document.createElement('div');
    mBody.className = 'month-body';
    entries.forEach(({ date, reports }) => { mBody.appendChild(buildDateGroup(date, reports, isFirstDate)); isFirstDate = false; });
    mGrp.append(mHdr, mBody);
    nav.appendChild(mGrp);
    isFirstMonth = false;
  });
}

window.addEventListener('popstate', () => { const h = getHash(); if (h) loadReport(h.date, h.report, false); else if (location.hash === '#dashboard') loadDashboard(); });

// ── Dashboard ──
const CHART_COLORS = ['#00f0ff','#a855f7','#f472b6','#34d399','#fb923c','#60a5fa','#fbbf24','#f87171','#818cf8','#2dd4bf'];
const chartInstances = [];

function destroyCharts() { chartInstances.forEach(c => c.destroy()); chartInstances.length = 0; }

function chartOpts(plugins) {
  const isDark = document.documentElement.dataset.theme === 'dark';
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: plugins || {},
    scales: {
      x: { ticks: { color: isDark ? '#5a5e73' : '#8b8fa3', font: { size: 10 } }, grid: { color: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)' }, border: { display: false } },
      y: { ticks: { color: isDark ? '#5a5e73' : '#8b8fa3', font: { size: 10 } }, grid: { color: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)' }, border: { display: false } }
    }
  };
}

function doughnutOpts(plugins) {
  return { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: plugins || {} };
}

function makeList(items, labelFn, metaFn) {
  return items.slice(0, 10).map(item => {
    const label = typeof labelFn === 'function' ? labelFn(item) : item.title;
    const meta = typeof metaFn === 'function' ? metaFn(item) : '';
    return `<div class="dash-list-item"><a href="${item.url || item.hnUrl || '#'}" target="_blank" rel="noopener">${label}</a><span class="meta">${meta}</span></div>`;
  }).join('');
}

async function loadDashboard() {
  currentKey = '__dashboard__';
  history.pushState(null, '', '#dashboard');
  document.querySelectorAll('.rpt-btn,.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('dashBtn').style.borderColor = 'rgba(0,240,255,0.3)';
  document.getElementById('dashBtn').style.color = 'var(--neon-cyan)';
  document.getElementById('sidebar').classList.remove('open');
  const cwrap = document.getElementById('cwrap');
  setContent('<div class="msg"><div class="msg-icon">⏳</div><div>Loading Dashboard…</div></div>');
  cwrap.scrollTop = 0;

  try {
    // Try today's date first, then yesterday (for UTC timezone difference)
    const today = new Date();
    const fmt = d => d.toISOString().slice(0, 10);
    const dates = [fmt(today), fmt(new Date(today.getTime() - 86400000))];
    let d = null;
    for (const date of dates) {
      const r = await fetch(`./digests/${date}/dashboard.json`);
      if (r.ok) { d = await r.json(); break; }
    }
    if (!d) throw new Error('dashboard.json not found');

    destroyCharts();
    const isDark = document.documentElement.dataset.theme === 'dark';
    const textColor = isDark ? '#8b8fa3' : '#5a5e73';
    Chart.defaults.color = textColor;

    let html = `<div class="dash fade-up">
      <div class="dash-header"><h1>📊 AI 数据全景</h1><div class="date">${d.date} · ${new Date(d.generated).toLocaleString('zh-CN')}</div></div>
      <div class="dash-stats">
        <div class="stat-card"><div class="stat-val">${d.trending.length}</div><div class="stat-label">🔥 GitHub 趋势</div></div>
        <div class="stat-card"><div class="stat-val">${d.hn.length}</div><div class="stat-label">📰 HN 热门</div></div>
        <div class="stat-card"><div class="stat-val">${d.ph.length}</div><div class="stat-label">🚀 Product Hunt</div></div>
        <div class="stat-card"><div class="stat-val">${d.arxiv.length}</div><div class="stat-label">📄 ArXiv 论文</div></div>
        <div class="stat-card"><div class="stat-val">${d.hf.length}</div><div class="stat-label">🤗 HF 模型</div></div>
        <div class="stat-card"><div class="stat-val">${d.devto.length + d.lobsters.length}</div><div class="stat-label">💬 社区讨论</div></div>
      </div>
      <div class="dash-grid">
        <div class="chart-card"><div class="chart-title"><span class="emoji">🔥</span> GitHub Trending Stars</div><div class="chart-wrap" style="height:260px"><canvas id="ch-trending"></canvas></div></div>
        <div class="chart-card"><div class="chart-title"><span class="emoji">🤗</span> HuggingFace 热门模型</div><div class="chart-wrap" style="height:260px"><canvas id="ch-hf"></canvas></div></div>
        <div class="chart-card"><div class="chart-title"><span class="emoji">📰</span> HN 热度 Top 10</div><div class="chart-wrap" style="height:260px"><canvas id="ch-hn"></canvas></div></div>
        <div class="chart-card"><div class="chart-title"><span class="emoji">🚀</span> Product Hunt 投票 Top 10</div><div class="chart-wrap" style="height:260px"><canvas id="ch-ph"></canvas></div></div>
        <div class="chart-card"><div class="chart-title"><span class="emoji">💻</span> 编程语言分布</div><div class="chart-wrap" style="height:240px"><canvas id="ch-lang"></canvas></div></div>
        <div class="chart-card"><div class="chart-title"><span class="emoji">📄</span> ArXiv 研究方向</div><div class="chart-wrap" style="height:240px"><canvas id="ch-arxiv"></canvas></div></div>
        <div class="chart-card full"><div class="chart-title"><span class="emoji">🔥</span> HN 热门讨论</div><div class="dash-list">${makeList(d.hn, i => i.title, i => `<span class="hot">▲${i.points}</span> 💬${i.comments}`)}</div></div>
        <div class="chart-card full"><div class="chart-title"><span class="emoji">🚀</span> Product Hunt 新品</div><div class="dash-list">${makeList(d.ph, i => i.name + ' — ' + i.tagline, i => `<span class="hot">▲${i.votes}</span>`)}</div></div>
        <div class="chart-card full"><div class="chart-title"><span class="emoji">🤗</span> HuggingFace 新模型</div><div class="dash-list">${makeList(d.hf, i => i.id, i => `❤️${i.likes} ⬇️${(i.downloads/1000).toFixed(0)}k`)}</div></div>
        <div class="chart-card full"><div class="chart-title"><span class="emoji">📄</span> ArXiv 最新论文</div><div class="dash-list">${makeList(d.arxiv, i => i.title, i => i.categories.slice(0,2).join(', '))}</div></div>
      </div>
    </div>`;
    setContent(html);

    // Render charts after DOM update
    requestAnimationFrame(() => {
      // Trending bar chart
      const t10 = d.trending.slice(0, 10);
      chartInstances.push(new Chart(document.getElementById('ch-trending'), {
        type: 'bar',
        data: { labels: t10.map(r => r.name.split('/')[1]?.slice(0,15) || r.name.slice(0,15)), datasets: [{ label: 'Today ⭐', data: t10.map(r => r.stars), backgroundColor: CHART_COLORS.slice(0,10).map(c => c + '99'), borderColor: CHART_COLORS.slice(0,10), borderWidth: 1, borderRadius: 4 }] },
        options: { ...chartOpts({ legend: { display: false } }), indexAxis: 'y' }
      }));

      // HF horizontal bar
      const hf10 = d.hf.slice(0, 10);
      chartInstances.push(new Chart(document.getElementById('ch-hf'), {
        type: 'bar',
        data: { labels: hf10.map(m => m.id.split('/')[1]?.slice(0,18) || m.id.slice(0,18)), datasets: [{ label: 'Likes', data: hf10.map(m => m.likes), backgroundColor: '#a855f799', borderColor: '#a855f7', borderWidth: 1, borderRadius: 4 }] },
        options: { ...chartOpts({ legend: { display: false } }), indexAxis: 'y' }
      }));

      // HN bar chart
      const hn10 = d.hn.slice(0, 10);
      chartInstances.push(new Chart(document.getElementById('ch-hn'), {
        type: 'bar',
        data: { labels: hn10.map(s => s.title.slice(0,25) + '…'), datasets: [{ label: 'Points', data: hn10.map(s => s.points), backgroundColor: '#00f0ff99', borderColor: '#00f0ff', borderWidth: 1, borderRadius: 4 }] },
        options: chartOpts({ legend: { display: false } })
      }));

      // PH bar chart
      const ph10 = d.ph.slice(0, 10);
      chartInstances.push(new Chart(document.getElementById('ch-ph'), {
        type: 'bar',
        data: { labels: ph10.map(p => p.name.slice(0,20)), datasets: [{ label: 'Votes', data: ph10.map(p => p.votes), backgroundColor: '#f472b699', borderColor: '#f472b6', borderWidth: 1, borderRadius: 4 }] },
        options: chartOpts({ legend: { display: false } })
      }));

      // Language doughnut
      const langMap = {};
      [...d.trending, ...d.search].forEach(r => { if (r.language) langMap[r.language] = (langMap[r.language] || 0) + 1; });
      const langEntries = Object.entries(langMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
      chartInstances.push(new Chart(document.getElementById('ch-lang'), {
        type: 'doughnut',
        data: { labels: langEntries.map(e => e[0]), datasets: [{ data: langEntries.map(e => e[1]), backgroundColor: CHART_COLORS.slice(0, langEntries.length), borderWidth: 0 }] },
        options: doughnutOpts({ legend: { position: 'right', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } } })
      }));

      // ArXiv category doughnut
      const catMap = {};
      d.arxiv.forEach(p => p.categories.forEach(c => { const short = c.replace('cs.',''); catMap[short] = (catMap[short] || 0) + 1; }));
      const catEntries = Object.entries(catMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
      chartInstances.push(new Chart(document.getElementById('ch-arxiv'), {
        type: 'doughnut',
        data: { labels: catEntries.map(e => e[0]), datasets: [{ data: catEntries.map(e => e[1]), backgroundColor: CHART_COLORS.slice(0, catEntries.length), borderWidth: 0 }] },
        options: doughnutOpts({ legend: { position: 'right', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } } })
      }));
    });
  } catch (e) {
    setContent(`<div class="msg"><div class="msg-icon">⚠️</div><div>Dashboard 加载失败：${e.message}<br><br><span style="font-size:11px;color:var(--text-muted)">需要先运行一次 daily digest 生成 dashboard.json</span></div></div>`);
  }
}

(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');
    buildNav(dates);
    // Delay search index to avoid blocking Dashboard load
    setTimeout(() => initSearch(dates), 5000);
    const hash = getHash();
    if (hash === 'dashboard') {
      loadDashboard();
    } else if (hash && dates.find(d => d.date === hash.date && d.reports.includes(hash.report))) {
      loadReport(hash.date, hash.report, false);
    } else {
      loadDashboard(); // Dashboard as default homepage
    }
  } catch (e) {
    document.getElementById('nav').innerHTML = '<div class="msg" style="height:80px;font-size:12px">⚠️ ' + e.message + '</div>';
    setContent('<div class="msg"><div class="msg-icon">📡</div><div>无法加载 manifest.json</div></div>');
  }
})();
</script>
</body>
</html>
